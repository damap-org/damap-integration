openapi: 3.0.4
info:
  title: DAMAP integration API
  description: |-
    The DAMAP integration API provides the integration points that DAMAP needs.
  license:
    name: MIT
    url: https://opensource.org/license/MIT
  version: 1.0.12
servers:
  - url: http://localhost:8080/api/
paths:
  /projects:
    get:
      summary: Get all projects
      description: Returns all available projects
      operationId: getProjects
      responses:
        '200':
          description: A list of all projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects/{projectId}/staff:
    get:
      summary: Get staff for project
      description: Returns a list of persons associated with a project.
      operationId: getStaffForProject
      parameters:
        - name: projectId
          in: path
          description: ID of the project
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of persons associated with the project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
components:
  schemas:
    Project:
      type: object
      properties:
        acronym:
          type: string
        universityId:
          type: string
        description:
          type: string
        title:
          type: string
        funding:
          $ref: "#/components/schemas/Funding"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        dmpExists:
          type: boolean
    Funding:
      type: object
      properties:
        fundingName:
          type: string
        fundingProgram:
          type: string
        funderId:
          $ref: "#/components/schemas/ID"
        grantId:
          $ref: "#/components/schemas/ID"
        fundingStatus:
          type: string
    ID:
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
      required:
        - identifier
        - type
    Person:
      type: object
      properties:
        universityId:
          type: string
        personId:
          $ref: "#/components/schemas/ID"
        firstName:
          type: string
        lastName:
          type: string
        mbox:
          type: string
          format: email
        affiliation:
          type: string
        affiliationId:
          $ref: "#/components/schemas/ID"
        contact:
          type: boolean
        roleInProject:
          type: string
    InternalError:
      $ref: "#/components/schemas/Error"
    BadGatewayError:
      $ref: "#/components/schemas/Error"
    BadRequestError:
      $ref: "#/components/schemas/Error"
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

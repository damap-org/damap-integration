# DAMAP Backend uses a OpenApi file that is essentially identical to this one
# For future work rewrite this file to just link to DAMAPs generic integration OpenApi file (needs code refactoring)
openapi: 3.0.4
info:
  title: DAMAP integration API
  description: |-
    The DAMAP integration API provides the integration points that DAMAP needs.
  license:
    name: MIT
    url: https://opensource.org/license/MIT
  version: 1.0.12
servers:
  - url: http://localhost:8090/api/
paths:
  /projects/{projectId}:
    get:
      summary: Get project with id
      description: Returns project with id
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          description: ID of the project
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project with id
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/DAMAPProject'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects/{projectId}/staff:
    get:
      summary: Get staff for project
      description: Returns a list of persons associated with a project.
      operationId: getStaffForProject
      parameters:
        - name: projectId
          in: path
          description: ID of the project
          required: true
          schema:
            type: string
      responses:
        200:
          description: A list of persons associated with the project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects/{projectId}/supplements:
    get:
      summary: Get supplemental project information
      description: Returns additional project information for project with id
      operationId: getProjectSupplements
      parameters:
        - name: projectId
          in: path
          description: ID of the project
          required: true
          schema:
            type: string
      responses:
        200:
          description: Project supplement for project with id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSupplement'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects/{projectId}/leader:
    get:
      summary: Get leader for project
      description: Returns the persons leading a project.
      operationId: getLeaderForProject
      parameters:
        - name: projectId
          in: path
          description: ID of the project
          required: true
          schema:
            type: string
      responses:
        200:
          description: A persons leading the project.
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Person'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects/recommended:
    get:
      summary: Get recommended projects determined by query
      description: Returns recommended projects
      operationId: getRecommendedProjects
      parameters:
        - name: email
          in: query
          required: false
          description: User email used to find recommended projects for user
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: User name used to find recommended projects for user
          schema:
            type: string
      responses:
        200:
          description: RecommendedProjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DAMAPProject'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /projects:
    get:
      summary: Search projects
      description: Returns projects matching the provided query
      operationId: searchProjects
      parameters:
        - name: q
          in: query
          required: false
          description: Search query used to find projects
          schema:
            type: string
      responses:
        200:
          description: Projects matching the search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProjectsResponseBody"
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /persons/{personId}:
    get:
      summary: Get person with id
      description: Returns person with id
      operationId: getPerson
      parameters:
        - name: personId
          in: path
          description: ID of the person
          required: true
          schema:
            type: string
      responses:
        200:
          description: Person with id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
  /persons:
    get:
      summary: Search persons
      description: Returns persons matching the provided query
      operationId: searchPersons
      parameters:
        - name: q
          in: query
          required: false
          description: Search query used to find persons
          schema:
            type: string
      responses:
        200:
          description: Persons matching the search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPersonsResponseBody"
        400:
          description: You have sent an invalid request. Please fix your request and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        500:
          description: The integration server encountered an internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalError"
        502:
          description: "The integration server is currently unable to fetch the requested data, please try again later."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadGatewayError"
components:
  # Maybe link to common standard objects so they dont need to be defined again
  schemas:
    Project:
      type: object
      properties:
        acronym:
          type: string
        project_id:
          type: array
          items:
            $ref: "#/components/schemas/ID"
        description:
          type: string
        title:
          type: string
        funding:
          type: array
          items:
            $ref: "#/components/schemas/Funding"
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      required:
        - project_id
        - title
    Funding:
      type: object
      properties:
        funder_id:
          $ref: "#/components/schemas/ID"
        grant_id:
          $ref: "#/components/schemas/ID"
        fundingStatus:
          type: string
    # Common Standard project with a system ID
    DAMAPProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
    ID:
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
      required:
        - identifier
        - type
    ProjectSupplement:
      type: object
      properties:
        personalData:
          type: boolean
        sensitiveData:
          type: boolean
        legalRestrictions:
          type: boolean
        humanParticipants:
          type: boolean
        ethicalIssuesExist:
          type: boolean
        committeeReviewed:
          type: boolean
        costsExist:
          type: boolean
    Person:
      type: object
      properties:
        contributorId:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        mbox:
          type: string
          format: email
        affiliation:
          type: array
          items:
            $ref: "#/components/schemas/Affiliation"
        role:
          type: array
          items:
            type: string
    Affiliation:
      type: object
      properties:
        affiliationId:
          $ref: "#/components/schemas/ID"
        name:
          type: string
      required:
        - affiliationId
        - name
    SearchProjectsResponseBody:
      type: object
      properties:
        totalItems:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/DAMAPProject"
    SearchPersonsResponseBody:
      type: object
      properties:
        totalItems:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    InternalError:
      $ref: "#/components/schemas/Error"
    BadGatewayError:
      $ref: "#/components/schemas/Error"
    BadRequestError:
      $ref: "#/components/schemas/Error"
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message

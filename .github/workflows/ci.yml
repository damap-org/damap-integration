name: Check
permissions:
  contents: write
on:
  pull_request:
  push:
    tags:
      - '*'
jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run go generate
        run: go generate ./...
      - name: Check if there are any changes
        run: |
          if [ "$(git diff | wc -l)" -ne 0 ]; then
            echo "Please run go generate ./... to update the generated code."
          fi
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: |
          go test ./...
  lint:
    name: Lint (Skipped)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint (Skipped)
        # run: go tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint run
        run: |
          echo "::warning::Linting temporarily disabled."
          echo "Blocked by a golangci-lint v2 type-checking issue with generated code."
          echo "If you can solve it please do :)"
  release:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - generate
      - lint
      - test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

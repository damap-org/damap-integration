# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: DAMAP integration
builds:
  - id: "binary"
    main: ./cmd/damap-integration
    binary: damap-integration
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
dockers:
  - use: buildx
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
    image_templates:
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Version }}-amd64"
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Major }}-amd64"
  - use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
    image_templates:
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Version }}-arm64"
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Major }}.{{ .Minor }}-arm64"
      - "ghcr.io/tuwien-csd/damap-integration:{{ .Major }}-arm64"
docker_manifests:
  - name_template: ghcr.io/tuwien-csd/damap-integration:{{ .Version }}
    image_templates:
      - ghcr.io/tuwien-csd/damap-integration:{{ .Version }}-amd64
      - ghcr.io/tuwien-csd/damap-integration:{{ .Version }}-arm64
  - name_template: ghcr.io/tuwien-csd/damap-integration:{{ .Major }}.{{ .Minor }}
    image_templates:
      - ghcr.io/tuwien-csd/damap-integration:{{ .Major }}.{{ .Minor }}-amd64
      - ghcr.io/tuwien-csd/damap-integration:{{ .Major }}.{{ .Minor }}-arm64
  - name_template: ghcr.io/tuwien-csd/damap-integration:{{ .Major }}
    image_templates:
      - ghcr.io/tuwien-csd/damap-integration:{{ .Major }}-amd64
      - ghcr.io/tuwien-csd/damap-integration:{{ .Major }}-arm64